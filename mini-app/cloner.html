<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="color-scheme" content="light dark">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GRAMGPT — Клонер</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header animate-in">
        <h2><i class="fas fa-copy" style="color: var(--primary)"></i> Клонер каналов</h2>
        <a href="index.html" class="text-secondary" style="text-decoration: none; font-size: 14px;">
            <i class="fas fa-arrow-left"></i> Назад
        </a>
    </div>

    <!-- Stats -->
    <div class="stat-row animate-in" style="animation-delay: 0.05s">
        <div class="stat-flex">
            <div class="stat-item"><h4>Задач</h4><div id="cln-count" style="color: var(--primary)">0</div></div>
            <div class="stat-item text-center"><h4>Скопировано</h4><div id="cln-copied" style="color: var(--success)">0</div></div>
            <div class="stat-item text-right"><h4>Активных</h4><div id="cln-active">0</div></div>
        </div>
    </div>

    <!-- Config -->
    <div class="card animate-in" style="animation-delay: 0.1s">
        <h4 class="mb-12"><i class="fas fa-play" style="color: var(--primary)"></i> Новая задача</h4>
        <div class="form-group">
            <label class="form-label">Канал-источник</label>
            <input type="text" class="form-input" id="src-channel" placeholder="@source_channel">
        </div>
        <div class="form-group">
            <label class="form-label">Каналы-цели (каждый с новой строки)</label>
            <textarea class="form-input" id="target-channels" rows="3" placeholder="@target1&#10;@target2"></textarea>
        </div>
        <div class="flex gap-8">
            <div class="flex-1"><label class="form-label">Лимит старых постов</label><input type="number" class="form-input" id="initial-limit" value="10"></div>
            <div class="flex-1"><label class="form-label">Интервал (сек)</label><input type="number" class="form-input" id="poll-interval" value="60"></div>
        </div>
        <div class="form-group mt-8">
            <label class="form-label">Трансформация текста</label>
            <select class="form-select" id="text-transform">
                <option value="none">Без изменений</option>
                <option value="prepend">Добавить префикс</option>
                <option value="append">Добавить суффикс</option>
                <option value="replace">Замена текста</option>
            </select>
        </div>
        <div class="form-group" id="transform-extra" style="display:none">
            <input type="text" class="form-input" id="prefix-text" placeholder="Текст префикса/суффикса">
        </div>
        <div class="flex gap-8 mt-8">
            <button class="btn flex-1" onclick="startCloner()"><i class="fas fa-play"></i> Запустить</button>
            <button class="btn btn-secondary flex-1" onclick="testCloner()"><i class="fas fa-vial"></i> Тест</button>
        </div>
    </div>

    <!-- Jobs List -->
    <div class="card animate-in" style="animation-delay: 0.15s">
        <div class="card-header"><h4>Задачи</h4><span class="status-badge badge-blue" id="cln-jobs-count">0</span></div>
        <div id="cln-jobs-list"><div class="empty-state"><i class="fas fa-copy"></i><h4>Нет задач</h4><p>Запустите клонирование канала</p></div></div>
    </div>

    <div class="nav-bar animate-in" style="animation-delay: 0.25s">
        <a href="index.html" class="nav-item"><i class="fas fa-home"></i></a>
        <a href="campaigns.html" class="nav-item"><i class="fas fa-tasks"></i></a>
        <a href="channel.html" class="nav-item"><i class="fas fa-tv"></i></a>
        <a href="dashboard.html" class="nav-item"><i class="fas fa-chart-pie"></i></a>
        <a href="settings.html" class="nav-item"><i class="fas fa-cog"></i></a>
    </div>

    <style>
        textarea.form-input { resize: vertical; min-height: 60px; }
    </style>

    <script src="main.js"></script>
    <script>
        document.getElementById('text-transform').addEventListener('change', function() {
            document.getElementById('transform-extra').style.display = (this.value === 'prepend' || this.value === 'append') ? 'block' : 'none';
        });

        function getConfig() {
            const sources = document.getElementById('target-channels').value.split('\n').map(s => s.trim()).filter(Boolean);
            return {
                source: document.getElementById('src-channel').value.trim(),
                targets: sources,
                initial_limit: parseInt(document.getElementById('initial-limit').value) || 10,
                polling_interval: parseInt(document.getElementById('poll-interval').value) || 60,
                text_transform: document.getElementById('text-transform').value,
                prefix: document.getElementById('prefix-text').value.trim() || null,
                suffix: document.getElementById('prefix-text').value.trim() || null,
                copy_existing: true,
                include_media: true,
            };
        }

        async function startCloner() {
            const cfg = getConfig();
            if (!cfg.source) { toast('warning', 'Укажите источник', 'Введите канал-источник'); return; }
            if (cfg.targets.length === 0) { toast('warning', 'Укажите цели', 'Введите хотя бы один целевой канал'); return; }
            haptic('medium');
            try {
                const r = await api.post('/cloner/start', cfg);
                if (r && r.job_id) toast('success', 'Клонер запущен', 'ID: ' + r.job_id);
                await loadJobs();
            } catch (e) { toast('error', 'Ошибка', e.message); }
        }

        async function testCloner() {
            const cfg = getConfig();
            if (!cfg.source) { toast('warning', 'Укажите источник', 'Введите канал-источник'); return; }
            haptic('medium');
            try {
                const r = await api.post('/cloner/test', cfg);
                toast(r.success ? 'success' : 'error', r.success ? 'Успешно' : 'Ошибка', r.message_preview || r.error || 'Тест завершён');
            } catch (e) { toast('error', 'Ошибка', e.message); }
        }

        async function stopCloner(id) {
            try {
                await api.post('/cloner/' + id + '/stop');
                toast('info', 'Стоп', 'Задача остановлена');
                await loadJobs();
            } catch (e) { toast('error', 'Ошибка', e.message); }
        }

        async function loadJobs() {
            try {
                const data = await api.get('/cloner/list');
                const jobs = data && data.data ? data.data : (Array.isArray(data) ? data : []);
                document.getElementById('cln-count').textContent = jobs.length;
                document.getElementById('cln-jobs-count').textContent = jobs.length;
                let totalCopied = 0, active = 0;
                const list = document.getElementById('cln-jobs-list');
                if (jobs.length === 0) {
                    list.innerHTML = '<div class="empty-state"><i class="fas fa-copy"></i><h4>Нет задач</h4><p>Запустите клонирование канала</p></div>';
                    return;
                }
                list.innerHTML = jobs.map(function(j) {
                    var s = j.status || 'unknown';
                    var badgeClass = s === 'running' ? 'badge-green' : s === 'completed' ? 'badge-blue' : 'badge-red';
                    if (s === 'running') active++;
                    var copied = (j.stats && j.stats.copied) || 0;
                    totalCopied += copied;
                    var actions = s === 'running' ? '<button class="btn-sm" onclick="stopCloner(' + j.id + ')" style="background:rgba(239,68,68,0.1);color:var(--danger);border:1px solid rgba(239,68,68,0.3);"><i class="fas fa-stop"></i></button>' : '';
                    return '<div class="job-item"><div class="flex-1"><div style="font-size:13px;font-weight:600;">' + escapeHtml(j.config.source || '—') + '</div><div style="font-size:10px;color:var(--text-secondary);">#' + j.id + ' → ' + ((j.config.targets || []).join(', ')) + ' — скопировано: ' + copied + '</div></div><div class="flex gap-4" style="align-items:center;"><span class="status-badge ' + badgeClass + '">' + s + '</span>' + actions + '</div></div>';
                }).join('');
                document.getElementById('cln-copied').textContent = totalCopied;
                document.getElementById('cln-active').textContent = active;
            } catch (e) { console.warn('Cloner load error:', e); }
        }

        document.addEventListener('DOMContentLoaded', loadJobs);
        function escapeHtml(str) { var d = document.createElement('div'); d.textContent = str; return d.innerHTML; }
    </script>
</body>
</html>
